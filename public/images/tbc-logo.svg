<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <linearGradient id="tbcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Modern Geometric Construction Icon (Hexagon Blocks & Crane Motif) -->
  <g transform="translate(15, 12)" filter="url(#shadow)">
    <!-- Outer shield / polygon -->
    <path d="M38 4 L68 20 L68 56 L38 72 L8 56 L8 20 Z" fill="url(#tbcGrad)" rx="4" />
    <!-- Golden Crane / Beam Accent -->
    <path d="M38 12 L60 25 L60 33 L38 20 Z" fill="url(#amberGrad)" />
    <!-- Structural pillars -->
    <path d="M22 30 L32 36 L32 58 L22 52 Z" fill="#ffffff" opacity="0.95" />
    <path d="M36 38 L46 32 L46 54 L36 60 Z" fill="url(#amberGrad)" />
    <circle cx="38" cy="22" r="3.5" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 18)">
    <!-- TBC Monogram -->
    <text x="0" y="42" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="1.5" fill="#0f172a">
      TBC
    </text>
    <text x="98" y="42" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="1.5" fill="#d97706">
      .
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="62" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="5" fill="#0369a1">
      CONSTRUCTION
    </text>
  </g>
</svg>